name: signals

on:
  schedule:
    # Пн–Пт о 22:30 UTC (після закриття США; FRED OAS публікується з лагом ~1 день).
    # GitHub часто запускає cron із затримкою до кількох годин.
    - cron: "30 22 * * 1-5"
    # Вт–Сб о 07:00 UTC — повторний прогін: доганяє закриття, якого Yahoo ще не віддав увечері
    # (зокрема п'ятничний тижневий сигнал). Алерти й Telegram — лише якщо щось змінилось.
    - cron: "0 7 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Compute signals
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python signals.py

      - name: Commit results
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "signals $(date -u +%F)"
          git push
